apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy  # <-- Make sure nodes/proxy is included
  - services
  - endpoints
  - pods
  - namespaces
  verbs: ["get", "list", "watch", "proxy"] # <-- Make sure "proxy" verb is included
- apiGroups: [""]
  resources:
  - configmaps
  verbs: ["get"]
- nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
  verbs: ["get"]