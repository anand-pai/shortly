apiVersion: v1
kind: ServiceAccount
metadata:
  name: txtly-prometheus
  namespace: scylla
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: txtly-prometheus
  namespace: scylla
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: txtly-prometheus
  namespace: scylla
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: txtly-prometheus
subjects:
  - kind: ServiceAccount
    name: txtly-prometheus
    namespace: scylla
