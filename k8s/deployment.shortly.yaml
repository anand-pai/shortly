apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shortly
spec:
  serviceName: "url-shortener-service"
  replicas: 15
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: shortly
  template:
    metadata:
      labels:
        app: shortly
    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: shortener
          image: shortly:3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name : grpc
            - containerPort: 9092
              name : metrics
            - containerPort: 8001
              name : http
          envFrom:
            - configMapRef:
                name: shortly-configs
          env:
            # 1. Downward API populates the pod name (e.g. url-shortener-4)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # 2. Hardcoded per region deployment (0 = Region A, 1 = Region B)
            - name: REGION_ID
              value: "0"
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
