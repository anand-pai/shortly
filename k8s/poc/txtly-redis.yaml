apiVersion: apps/v1
kind: Deployment
metadata:
  name: txtly-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: txtly-redis
  template:
    metadata:
      labels:
        app: txtly-redis
    spec:
      nodeSelector:
        name: scylladb
      tolerations:
        - key: "name"
          operator: "Equal"
          value: "scylladb"
          effect: "NoSchedule"
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: txtly-redis
spec:
  selector:
    app: txtly-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
