apiVersion: v1
kind: Service

metadata:
  name: txtly-svc

spec:
  selector:
    app: txtly-app
  ports:
    - name : grpc
      port: 8080
      targetPort: grpc
    - name : metrics
      port : 9092
      targetPort : metrics
    - name : http
      port : 8001
      targetPort : http
  type: NodePort
