apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: txtly-app
spec:
  serviceName: "txtly-headless"
  replicas: 15
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: txtly-app
  template:
    metadata:
      labels:
        app: txtly-app
    spec:
      nodeSelector:
        name: scylladb
      tolerations:
        - key: "name"
          operator: "Equal"
          value: "scylladb"
          effect: "NoSchedule"
      containers:
        - name: txtly-app
          image: debian:bookworm-slim
          command: ["sleep", "infinity"]
          ports:
            - containerPort: 8080
              name: grpc
            - containerPort: 9092
              name: metrics
            - containerPort: 8001
              name: http
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REGION_ID
              value: "0"
          envFrom:
            - configMapRef:
                name: txtly-configs
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
